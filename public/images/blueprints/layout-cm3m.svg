<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <pattern id="grid3m" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="500" height="400" fill="#f8fafc"/>
  <rect width="500" height="400" fill="url(#grid3m)"/>
  
  <!-- Outer Walls -->
  <rect x="50" y="50" width="400" height="300" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>
  
  <!-- Dimension Lines -->
  <line x1="50" y1="25" x2="450" y2="25" stroke="#00b140" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="250" y="20" fill="#00b140" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3.00 m (LONGITUD EXTERIOR)</text>
  
  <line x1="475" y1="50" x2="475" y2="350" stroke="#00b140" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="480" y="205" fill="#00b140" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" transform="rotate(90 480 205)" text-anchor="middle">2.44 m</text>
  
  <!-- Windows (top and right) -->
  <line x1="120" y1="50" x2="240" y2="50" stroke="#0284c7" stroke-width="5"/>
  <text x="180" y="42" fill="#0284c7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VENTANA</text>
  
  <line x1="450" y1="120" x2="450" y2="220" stroke="#0284c7" stroke-width="5"/>
  <text x="440" y="175" fill="#0284c7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" transform="rotate(-90 440 175)" text-anchor="middle">VENTANA</text>
  
  <!-- Main Entry Door (Bottom right) -->
  <path d="M 380 350 A 60 60 0 0 1 320 290" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="380" y1="350" x2="320" y2="290" stroke="#0284c7" stroke-width="3"/>
  <text x="350" y="380" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ACCESO PRINCIPAL</text>
  
  <!-- Furniture: Perimeter Workstations (Left and Top) -->
  <rect x="70" y="70" width="260" height="60" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <rect x="70" y="130" width="60" height="150" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <text x="200" y="105" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MESA PERIMETRAL DE TRABAJO</text>
  
  <!-- Chairs -->
  <circle cx="200" cy="170" r="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <circle cx="160" cy="220" r="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  
  <!-- Minisplit AC unit -->
  <rect x="360" y="55" width="70" height="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="3"/>
  <text x="395" y="69" fill="#0284c7" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">A/C MINISPLIT</text>
  
  <!-- Title Block -->
  <rect x="60" y="290" width="130" height="50" fill="#0f172a" rx="6"/>
  <text x="125" y="312" fill="#00b140" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CAPELTON</text>
  <text x="125" y="328" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">CM-3M / CM-3MR</text>
</svg>