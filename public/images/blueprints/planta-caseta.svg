<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="700" height="400" fill="#f8fafc"/>
  <rect width="700" height="400" fill="url(#grid2)"/>
  
  <!-- Outer Walls -->
  <rect x="50" y="50" width="600" height="300" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>
  
  <!-- Dimension -->
  <line x1="50" y1="25" x2="650" y2="25" stroke="#00b140" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="350" y="20" fill="#00b140" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">6.00 m (CASETA SUPERVISIÓN)</text>
  
  <!-- Partition Restroom -->
  <line x1="480" y1="50" x2="480" y2="350" stroke="#0f172a" stroke-width="6"/>
  
  <!-- Restroom Door -->
  <path d="M 480 200 A 50 50 0 0 0 430 250" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="480" y1="200" x2="430" y2="250" stroke="#0284c7" stroke-width="2.5"/>
  
  <!-- Main Access Door -->
  <path d="M 180 350 A 60 60 0 0 1 120 290" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="180" y1="350" x2="120" y2="290" stroke="#0284c7" stroke-width="3"/>
  
  <!-- 360 Windows (Blue thick lines on perimeter) -->
  <line x1="100" y1="50" x2="400" y2="50" stroke="#0284c7" stroke-width="4"/>
  <line x1="50" y1="100" x2="50" y2="260" stroke="#0284c7" stroke-width="4"/>
  <line x1="280" y1="350" x2="440" y2="350" stroke="#0284c7" stroke-width="4"/>
  
  <!-- Desk Counter -->
  <rect x="70" y="70" width="370" height="60" fill="#f1f5f9" stroke="#00b140" stroke-width="2" rx="4"/>
  <text x="250" y="105" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">BARRA DE CONTROL Y MONITOREO 360°</text>
  
  <circle cx="250" cy="180" r="18" fill="#dcfce7" stroke="#00b140" stroke-width="2"/>
  <text x="250" y="215" fill="#64748b" font-family="system-ui" font-size="10" text-anchor="middle">OPERADOR</text>

  <!-- Bathroom details -->
  <circle cx="560" cy="100" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="560" y="130" fill="#64748b" font-family="system-ui" font-size="11" text-anchor="middle">W.C.</text>
  <rect x="530" y="260" width="60" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="560" y="285" fill="#64748b" font-family="system-ui" font-size="11" text-anchor="middle">LAVABO</text>
</svg>