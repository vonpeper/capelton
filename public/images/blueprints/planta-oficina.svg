<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1000" height="400" fill="#f8fafc"/>
  <rect width="1000" height="400" fill="url(#grid)"/>
  
  <!-- Outer Walls -->
  <rect x="50" y="50" width="900" height="300" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>
  
  <!-- Dimension Lines -->
  <line x1="50" y1="25" x2="950" y2="25" stroke="#00b140" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="500" y="20" fill="#00b140" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">10.00 m (LONGITUD EXTERIOR)</text>
  
  <line x1="975" y1="50" x2="975" y2="350" stroke="#00b140" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="980" y="205" fill="#00b140" font-family="system-ui" font-size="14" font-weight="bold" transform="rotate(90 980 205)" text-anchor="middle">2.50 m</text>
  
  <!-- Partitions -->
  <line x1="450" y1="50" x2="450" y2="250" stroke="#0f172a" stroke-width="6"/>
  <line x1="750" y1="50" x2="750" y2="350" stroke="#0f172a" stroke-width="6"/>
  
  <!-- Door Executive Office (450,250) -->
  <path d="M 450 250 A 60 60 0 0 0 510 310" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="450" y1="250" x2="510" y2="310" stroke="#0284c7" stroke-width="2.5"/>
  
  <!-- Main Entry Door (Bottom) -->
  <path d="M 300 350 A 70 70 0 0 1 230 280" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="300" y1="350" x2="230" y2="280" stroke="#0284c7" stroke-width="3"/>
  <text x="260" y="380" fill="#64748b" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">ACCESO PRINCIPAL</text>
  
  <!-- Restroom Door -->
  <path d="M 750 220 A 50 50 0 0 1 700 270" fill="none" stroke="#0284c7" stroke-width="2"/>
  <line x1="750" y1="220" x2="700" y2="270" stroke="#0284c7" stroke-width="2.5"/>
  
  <!-- Furniture: Open Workstations (Left Zone) -->
  <rect x="100" y="80" width="140" height="70" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <text x="170" y="120" fill="#475569" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">ESCRITORIO 01</text>
  <circle cx="170" cy="180" r="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  
  <rect x="280" y="80" width="140" height="70" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <text x="350" y="120" fill="#475569" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">ESCRITORIO 02</text>
  <circle cx="350" cy="180" r="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>

  <!-- Furniture: Executive Private Office (Middle Zone) -->
  <rect x="520" y="100" width="180" height="85" fill="#f1f5f9" stroke="#00b140" stroke-width="2" rx="4"/>
  <text x="610" y="145" fill="#0f172a" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">DIRECCIÓN GENERAL</text>
  <circle cx="610" cy="220" r="20" fill="#dcfce7" stroke="#00b140" stroke-width="2"/>
  
  <!-- Restroom / Sanitarios (Right Zone) -->
  <rect x="800" y="70" width="50" height="60" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <circle cx="825" cy="100" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="825" y="150" fill="#64748b" font-family="system-ui" font-size="11" text-anchor="middle">W.C.</text>
  <rect x="800" y="260" width="60" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="830" y="285" fill="#64748b" font-family="system-ui" font-size="11" text-anchor="middle">LAVABO</text>

  <!-- Title Block -->
  <rect x="60" y="270" width="130" height="65" fill="#0f172a" rx="6"/>
  <text x="125" y="295" fill="#00b140" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">CAPELTON</text>
  <text x="125" y="315" fill="#ffffff" font-family="system-ui" font-size="10" text-anchor="middle">PLANO TÉCNICO</text>
</svg>